name: R2D2PomiarLidar
options:
  bundleIdPrefix: pl.rozkroj
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  R2D2PomiarLidar:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: R2D2_POMIAR_LIDAR
        NSCameraUsageDescription: Aparat służy do robienia zdjęć z pomiarem głębi.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - sdk: RoomPlan.framework
      - sdk: ARKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.rozkroj.r2d2pomiarlidar
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [R2D2PomiarLidarTests]
  R2D2PomiarLidarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: R2D2PomiarLidar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
