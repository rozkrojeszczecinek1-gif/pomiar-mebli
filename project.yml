name: PomiarMebli
options:
  bundleIdPrefix: pl.rozkroj
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PomiarMebli:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pomiar mebli
        NSCameraUsageDescription: Aparat służy do robienia zdjęć z pomiarem głębi.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.rozkroj.pomiarmebli
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [PomiarMebliTests]
  PomiarMebliTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PomiarMebli
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
